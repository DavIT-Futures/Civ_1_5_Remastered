name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and engine tests
    runs-on: windows-latest
    env:
      GAME_FILES_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The original game files live in the private repository DavIT-Futures/CivGameFiles. With the secret
      # GAME_FILES_TOKEN (a token that can read that repository) they are placed in CIVILIZATION/, so the engine
      # tests run too; without it those tests skip themselves and only the unit tests run.
      - name: Checkout original game files
        if: env.GAME_FILES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: DavIT-Futures/CivGameFiles
          token: ${{ secrets.GAME_FILES_TOKEN }}
          path: gamefiles

      - name: Place game files in CIVILIZATION
        if: env.GAME_FILES_TOKEN != ''
        shell: pwsh
        run: |
          $source = if (Test-Path gamefiles/CIVILIZATION) { "gamefiles/CIVILIZATION" } else { "gamefiles" }
          New-Item -ItemType Directory -Force -Path CIVILIZATION | Out-Null
          Get-ChildItem -Path $source -File | Where-Object { $_.Name -ne "README.md" } | Copy-Item -Destination CIVILIZATION
          $count = (Get-ChildItem CIVILIZATION -File).Count
          Write-Host "Game files: $count"
          if (-not (Test-Path CIVILIZATION/CIV.EXE)) { Write-Host "::warning::CIV.EXE not found in CivGameFiles, engine tests will skip" }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Civ_1_5_Remastered.sln -c Release

      - name: Test
        run: dotnet test Civ_1_5_Remastered.Tests/Civ_1_5_Remastered.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
