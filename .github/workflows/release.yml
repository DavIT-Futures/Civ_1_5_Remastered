name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            platform: macos-arm64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            platform: macos-x64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish application
        run: dotnet publish Civ_1_5_Remastered.Desktop/Civ_1_5_Remastered.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o ./publish

      - name: Clean up PDBs
        shell: bash
        run: rm -f ./publish/*.pdb

      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}") { "${{ github.ref_name }}" } else { "latest" }
          $versionedName = "${{ github.event.repository.name }}-$ver-${{ matrix.platform }}.zip"
          $legacyName = "${{ github.event.repository.name }}-${{ matrix.rid }}.zip"
          $genericName = "${{ github.event.repository.name }}-${{ matrix.platform }}.zip"
          Compress-Archive -Path ./publish/* -DestinationPath ./$versionedName -Force
          Copy-Item -Path ./$versionedName -Destination ./$legacyName -Force
          Copy-Item -Path ./$versionedName -Destination ./$genericName -Force

      - name: Archive (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          [ -z "$VER" ] && VER="latest"
          FILENAME="${{ github.event.repository.name }}-${VER}-${{ matrix.platform }}.tar.gz"
          GENERIC_NAME="${{ github.event.repository.name }}-${{ matrix.platform }}.tar.gz"
          tar -czvf "./$FILENAME" -C ./publish .
          cp "./$FILENAME" "./$GENERIC_NAME"

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./${{ github.event.repository.name }}-*.zip
            ./${{ github.event.repository.name }}-*.tar.gz

      - name: Upload artifact (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.platform }}
          path: |
            ./${{ github.event.repository.name }}-*.zip
            ./${{ github.event.repository.name }}-*.tar.gz

  release-summary:
    name: Generate Release Summary
    needs: build
    runs-on: ubuntu-latest
    if: "!cancelled() && startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Update Release Notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body: |
            ### Standalone Packages (No .NET runtime required)

            | Platform | Architecture | Package Link |
            | :--- | :--- | :--- |
            | **Windows** | x64 | [Civ_1_5_Remastered-${{ github.ref_name }}-windows-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Civ_1_5_Remastered-${{ github.ref_name }}-windows-x64.zip) |
            | **Linux** | x64 | [Civ_1_5_Remastered-${{ github.ref_name }}-linux-x64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Civ_1_5_Remastered-${{ github.ref_name }}-linux-x64.tar.gz) |
            | **macOS** | Apple Silicon (ARM64) | [Civ_1_5_Remastered-${{ github.ref_name }}-macos-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Civ_1_5_Remastered-${{ github.ref_name }}-macos-arm64.tar.gz) |
            | **macOS** | Intel (x64) | [Civ_1_5_Remastered-${{ github.ref_name }}-macos-x64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Civ_1_5_Remastered-${{ github.ref_name }}-macos-x64.tar.gz) |
