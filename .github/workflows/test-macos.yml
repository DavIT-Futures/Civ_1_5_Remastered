name: Test macOS Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test'
        required: true
        default: 'v1.5.0'
      debug_ssh:
        description: 'Open interactive SSH session via tmate for manual testing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-macos-arm64:
    name: Test macOS (Apple Silicon ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS ARM64 release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading macOS ARM64 package for ${{ inputs.release_tag }}..."
          gh release download "${{ inputs.release_tag }}" --pattern "*macos-arm64.tar.gz" --dir ./download_arm64
          ls -la ./download_arm64

      - name: Extract macOS ARM64 package
        run: |
          mkdir -p ./app_arm64
          TAR_FILE=$(find ./download_arm64 -name "*macos-arm64.tar.gz" | head -n 1)
          echo "Extracting $TAR_FILE..."
          tar -xzf "$TAR_FILE" -C ./app_arm64
          ls -la ./app_arm64

      - name: Inspect Mach-O binary and dylibs
        run: |
          cd ./app_arm64
          echo "=== File Architecture ==="
          file Civ_1_5_Remastered.Desktop
          file libAvaloniaNative.dylib libSkiaSharp.dylib libHarfBuzzSharp.dylib

          echo "=== Shared Library Dependencies (otool -L) ==="
          otool -L Civ_1_5_Remastered.Desktop

          echo "=== Code Signature Details ==="
          codesign -dv --verbose=4 Civ_1_5_Remastered.Desktop || true

          echo "=== Assets Verification ==="
          ls -la Assets/Midi/poland_raw.mid Assets/Midi/japan_raw.mid
          ls -la Assets/Drivers/

      - name: Smoke Test Execution (Launch app and verify process stability)
        run: |
          cd ./app_arm64
          chmod +x Civ_1_5_Remastered.Desktop

          echo "Launching Civ_1_5_Remastered.Desktop in background..."
          ./Civ_1_5_Remastered.Desktop &
          APP_PID=$!

          echo "Application started with PID: $APP_PID. Waiting 5 seconds to verify startup..."
          sleep 5

          if ps -p $APP_PID > /dev/null; then
            echo "SUCCESS: Civ 1.5 Remastered is running smoothly on macOS ARM64!"
            kill -TERM $APP_PID 2>/dev/null || true
          else
            wait $APP_PID
            STATUS=$?
            echo "Process finished with exit code: $STATUS"
            if [ $STATUS -ne 0 ]; then
              echo "Process crashed or exited unexpectedly!"
              exit $STATUS
            fi
          fi

      - name: Interactive SSH Session (tmate)
        if: ${{ inputs.debug_ssh }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false

  test-macos-x64:
    name: Test macOS (Intel x64 via Rosetta 2)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS x64 release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading macOS x64 package for ${{ inputs.release_tag }}..."
          gh release download "${{ inputs.release_tag }}" --pattern "*macos-x64.tar.gz" --dir ./download_x64
          ls -la ./download_x64

      - name: Extract macOS x64 package
        run: |
          mkdir -p ./app_x64
          TAR_FILE=$(find ./download_x64 -name "*macos-x64.tar.gz" | head -n 1)
          echo "Extracting $TAR_FILE..."
          tar -xzf "$TAR_FILE" -C ./app_x64
          ls -la ./app_x64

      - name: Inspect Mach-O binary and dylibs
        run: |
          cd ./app_x64
          echo "=== File Architecture ==="
          file Civ_1_5_Remastered.Desktop
          file libAvaloniaNative.dylib libSkiaSharp.dylib libHarfBuzzSharp.dylib

          echo "=== Shared Library Dependencies (otool -L) ==="
          otool -L Civ_1_5_Remastered.Desktop

          echo "=== Assets Verification ==="
          ls -la Assets/Midi/poland_raw.mid Assets/Midi/japan_raw.mid

      - name: Smoke Test Execution (Launch app under Rosetta 2)
        run: |
          cd ./app_x64
          chmod +x Civ_1_5_Remastered.Desktop

          echo "Launching x86_64 binary on macOS..."
          ./Civ_1_5_Remastered.Desktop &
          APP_PID=$!

          echo "Application started with PID: $APP_PID. Waiting 5 seconds..."
          sleep 5

          if ps -p $APP_PID > /dev/null; then
            echo "SUCCESS: Civ 1.5 Remastered (Intel x64) is running smoothly on macOS!"
            kill -TERM $APP_PID 2>/dev/null || true
          else
            wait $APP_PID
            STATUS=$?
            echo "Process finished with exit code: $STATUS"
            if [ $STATUS -ne 0 ]; then
              echo "Process crashed or exited unexpectedly!"
              exit $STATUS
            fi
          fi
