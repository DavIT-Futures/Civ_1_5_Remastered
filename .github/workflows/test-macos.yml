name: Test macOS Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test'
        required: true
        default: 'v1.5.0'
      debug_ssh:
        description: 'Open interactive SSH session via tmate for manual testing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-macos:
    name: Test macOS (Apple Silicon ARM64 & Intel x64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Downloading macOS packages for ${{ inputs.release_tag }} ==="
          mkdir -p ./downloads
          gh release download "${{ inputs.release_tag }}" --pattern "*macos*.tar.gz" --dir ./downloads
          ls -la ./downloads

      - name: Extract macOS ARM64 package
        run: |
          mkdir -p ./app_arm64
          ARM_TAR=$(find ./downloads -name "*macos-arm64.tar.gz" | head -n 1)
          echo "Extracting ARM64 package: $ARM_TAR..."
          tar -xzf "$ARM_TAR" -C ./app_arm64
          ls -la ./app_arm64

      - name: Inspect & Test macOS ARM64 (Native Apple Silicon)
        run: |
          cd ./app_arm64
          echo "=== 1. ARM64 Architecture Verification ==="
          file Civ_1_5_Remastered.Desktop
          file libAvaloniaNative.dylib libSkiaSharp.dylib libHarfBuzzSharp.dylib

          echo "=== 2. Dynamic Library Dependencies (otool -L) ==="
          otool -L Civ_1_5_Remastered.Desktop

          echo "=== 3. Assets Verification ==="
          ls -la Assets/Midi/poland_raw.mid Assets/Midi/japan_raw.mid Assets/Drivers/

          echo "=== 4. Smoke Test Execution (Launch ARM64 Native) ==="
          chmod +x Civ_1_5_Remastered.Desktop
          ./Civ_1_5_Remastered.Desktop &
          APP_PID=$!
          echo "Started process PID $APP_PID. Waiting 5s..."
          sleep 5

          if ps -p $APP_PID > /dev/null; then
            echo "SUCCESS: Civ 1.5 Remastered is running smoothly on Apple Silicon (ARM64)!"
            kill -TERM $APP_PID 2>/dev/null || true
          else
            wait $APP_PID
            STATUS=$?
            echo "Process exited with code $STATUS"
            [ $STATUS -eq 0 ] || exit $STATUS
          fi

      - name: Extract macOS x64 package
        run: |
          mkdir -p ./app_x64
          X64_TAR=$(find ./downloads -name "*macos-x64.tar.gz" | head -n 1)
          echo "Extracting Intel x64 package: $X64_TAR..."
          tar -xzf "$X64_TAR" -C ./app_x64
          ls -la ./app_x64

      - name: Inspect & Test macOS Intel x64 (via Rosetta 2)
        run: |
          cd ./app_x64
          echo "=== 1. Intel x64 Architecture Verification ==="
          file Civ_1_5_Remastered.Desktop
          file libAvaloniaNative.dylib libSkiaSharp.dylib libHarfBuzzSharp.dylib

          echo "=== 2. Dynamic Library Dependencies (otool -L) ==="
          otool -L Civ_1_5_Remastered.Desktop

          echo "=== 3. Assets Verification ==="
          ls -la Assets/Midi/poland_raw.mid Assets/Midi/japan_raw.mid Assets/Drivers/

          echo "=== 4. Smoke Test Execution (Launch Intel x64 under Rosetta 2) ==="
          chmod +x Civ_1_5_Remastered.Desktop
          ./Civ_1_5_Remastered.Desktop &
          APP_PID=$!
          echo "Started process PID $APP_PID under Rosetta. Waiting 5s..."
          sleep 5

          if ps -p $APP_PID > /dev/null; then
            echo "SUCCESS: Civ 1.5 Remastered (Intel x64) is running smoothly under Rosetta 2 on macOS!"
            kill -TERM $APP_PID 2>/dev/null || true
          else
            wait $APP_PID
            STATUS=$?
            echo "Process exited with code $STATUS"
            [ $STATUS -eq 0 ] || exit $STATUS
          fi

      - name: Interactive SSH Session (tmate)
        if: ${{ inputs.debug_ssh }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false
